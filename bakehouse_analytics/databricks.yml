# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 8bf19dc0-dea8-463e-92a7-9e64bbd4e2c9

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse que ejecuta las consultas del dashboard
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405615752020829.9.azuredatabricks.net
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
      warehouse_id: 4e8a6a57d3bfce96
  prod:
    mode: production
    workspace:
      host: https://adb-7405617691729987.7.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/rommel.rodriguez07@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rommel.rodriguez07@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prod
      schema: rnd
      warehouse_id: ea0b55c54a62b157
    permissions:
      - user_name: rommel.rodriguez07@outlook.com
        level: CAN_MANAGE
